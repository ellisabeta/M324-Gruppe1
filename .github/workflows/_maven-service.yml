name: Maven-Service (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Ordnername des Services unter Code/P2"
        required: true
        type: string

jobs:
  verify:
    name: Verify ${{ inputs.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Code/P2/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/${{ inputs.service }}/pom.xml

      - name: Build, Unit- und Integrationstests
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ inputs.service }}
          path: |
            Code/P2/${{ inputs.service }}/target/surefire-reports/
            Code/P2/${{ inputs.service }}/target/failsafe-reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-${{ github.sha }}
          path: Code/P2/${{ inputs.service }}/target/*.jar
          if-no-files-found: error
