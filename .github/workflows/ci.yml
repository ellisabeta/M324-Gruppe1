name: CI / CD

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
    paths:
      - "Code/P2/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/_system-test.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: JAR bauen
        run: mvn -B -ntp package -DskipUnitTests

      - name: JAR hochladen
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: Code/P2/${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 14

  unit-test:
    name: Unit Tests ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: Unit Tests (Surefire)
        run: mvn -B -ntp test

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ matrix.service }}
          path: Code/P2/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  integration-test:
    name: Integrationstests ${{ matrix.service }}
    needs: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: Integrationstests (Failsafe + Testcontainers MongoDB)
        run: mvn -B -ntp verify -DskipUnitTests

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports-${{ matrix.service }}
          path: Code/P2/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore

  system-test:
    name: Systemtest
    needs: integration-test
    uses: ./.github/workflows/_system-test.yml

  publish:
    name: Publish ${{ matrix.service }}
    needs: system-test
    # nur main, Release-Tags (v*) und manueller Start; Feature-Branches und PRs publizieren nicht
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ flughafen-service, flug-service ]
    steps:
      - uses: actions/checkout@v7

      - name: Getestetes JAR laden
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: Code/P2/${{ matrix.service }}/target

      - name: Image-Name und Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/m324-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und publizieren
        id: push
        uses: docker/build-push-action@v7
        with:
          context: Code/P2/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publiziertes Image ausgeben
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  delivery:
    name: Release erstellen (Delivery)
    needs: publish
    # Delivery: Automatische Release-Erstellung bei Release-Tags (z. B. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JAR flughafen-service laden
        uses: actions/download-artifact@v8
        with:
          name: flughafen-service-${{ github.sha }}
          path: release-assets/

      - name: JAR flug-service laden
        uses: actions/download-artifact@v8
        with:
          name: flug-service-${{ github.sha }}
          path: release-assets/

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          CLEAN_TAG="${GITHUB_REF_NAME#v}"
          gh release create "$VERSION" \
            release-assets/*.jar \
            --title "Release $VERSION" \
            --generate-notes \
            --notes "### Release $VERSION

          Automatisches Continuous Delivery Release aus der CI/CD-Pipeline.

          #### Docker-Images (GHCR)
          - \`ghcr.io/${{ github.repository_owner }}/m324-flughafen-service:$CLEAN_TAG\`
          - \`ghcr.io/${{ github.repository_owner }}/m324-flug-service:$CLEAN_TAG\`

          #### Build-Artefakte
          - Getestete JAR-Dateien sind als Assets an dieses Release angehaengt."

  deploy:
    name: Docker Deployment
    needs: publish
    # Continuous Deployment: Deployt bei Push auf main, bei Release-Tags (v*) oder manuellem Start
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deployment-Tag ermitteln
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # SemVer-Tag ohne fuehrendes 'v' (z. B. 1.0.0)
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="main"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "image_tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deployment-Tag: $VERSION"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versionierte Images aus GHCR ziehen
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker compose -f Code/P2/docker-compose.deploy.yml pull

      - name: Container via Docker Compose starten
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker compose -f Code/P2/docker-compose.deploy.yml up -d

      - name: Smoke Test nach Deployment ausfuehren
        run: |
          bash Code/P2/deployment/smoke-test.sh

      - name: Deployment-Nachweis erfassen
        run: |
          {
            echo "## Deployment Nachweis"
            echo "**Zielumgebung:** Docker Host (Ubuntu Runner / Target Server)"
            echo "**Verwendeter Image-Tag:** \`${{ steps.tag.outputs.image_tag }}\`"
            echo "**Git Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "### Laufende Container & Versionierte Artefakte:"
            echo "\`\`\`text"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            echo "\`\`\`"
            echo ""
            echo "### Exakte Image-IDs (Digests):"
            echo "\`\`\`text"
            docker inspect --format '{{.Name}}: {{.Config.Image}} -> {{.Image}}' m324-flughafen-service m324-flug-service
            echo "\`\`\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Container-Logs bei Fehler
        if: failure()
        run: |
          docker compose -f Code/P2/docker-compose.deploy.yml logs

      - name: Services stoppen (Runner-Cleanup)
        if: always()
        run: |
          docker compose -f Code/P2/docker-compose.deploy.yml down -v
