# Deployment-Konfiguration: Startet die versionierten Docker-Images aus der GitHub Container Registry (GHCR)
# Verwendung:
#   IMAGE_TAG=sha-1d11ac3 docker compose -f docker-compose.deploy.yml up -d
#   IMAGE_TAG=1.0.0 docker compose -f docker-compose.deploy.yml up -d

services:
  mongo:
    image: mongo:7.0
    container_name: m324-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  flughafen-service:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-ellisabeta}/m324-flughafen-service:${IMAGE_TAG:-latest}
    container_name: m324-flughafen-service
    restart: unless-stopped
    environment:
      MONGODB_AIRPORT_URI: ${MONGODB_AIRPORT_URI:-mongodb://mongo:27017/flughafen_db}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  flug-service:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-ellisabeta}/m324-flug-service:${IMAGE_TAG:-latest}
    container_name: m324-flug-service
    restart: unless-stopped
    environment:
      MONGODB_FLIGHT_URI: ${MONGODB_FLIGHT_URI:-mongodb://mongo:27017/flug_db}
      AIRPORT_SERVICE_URL: http://flughafen-service:8081
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "8082:8082"
    depends_on:
      - mongo
      - flughafen-service

volumes:
  mongo-data:

